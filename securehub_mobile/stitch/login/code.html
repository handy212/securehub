<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SecureHub - Secure Access</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "outline-variant": "#c7c6cb",
                    "on-secondary-fixed-variant": "#275000",
                    "surface-container-lowest": "#ffffff",
                    "on-secondary": "#ffffff",
                    "inverse-surface": "#2f312f",
                    "surface-container-highest": "#e3e2df",
                    "on-primary-fixed": "#191b21",
                    "on-tertiary": "#ffffff",
                    "inverse-on-surface": "#f2f1ee",
                    "tertiary-fixed": "#ffdbcf",
                    "surface-container": "#efeeeb",
                    "primary-container": "#1f2127",
                    "error": "#ba1a1a",
                    "surface-bright": "#faf9f6",
                    "secondary-fixed-dim": "#94d95a",
                    "on-primary-container": "#878890",
                    "on-surface": "#1b1c1a",
                    "surface-tint": "#5d5e65",
                    "on-primary": "#ffffff",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary-fixed": "#aef673",
                    "primary-fixed-dim": "#c5c6ce",
                    "tertiary": "#1b0400",
                    "primary-fixed": "#e2e2ea",
                    "on-tertiary-fixed": "#380d00",
                    "tertiary-fixed-dim": "#ffb59b",
                    "primary": "#080a10",
                    "surface-container-high": "#e9e8e5",
                    "on-tertiary-fixed-variant": "#812900",
                    "outline": "#76777b",
                    "surface-container-low": "#f4f3f0",
                    "on-primary-fixed-variant": "#45464d",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#3a7100",
                    "secondary": "#366b00",
                    "on-background": "#1b1c1a",
                    "background": "#faf9f6",
                    "inverse-primary": "#c5c6ce",
                    "surface-dim": "#dbdad7",
                    "surface": "#faf9f6",
                    "secondary-container": "#aef673",
                    "on-tertiary-container": "#e55e25",
                    "on-secondary-fixed": "#0c2000",
                    "surface-variant": "#e3e2df",
                    "tertiary-container": "#411100",
                    "on-surface-variant": "#46464b"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-image: radial-gradient(circle at 2px 2px, #e3e2df 1px, transparent 0);
            background-size: 40px 40px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-between overflow-hidden relative">
<div class="absolute inset-0 bg-pattern opacity-40 pointer-events-none"></div>
<header class="w-full pt-12 pb-6 px-6 z-10 flex flex-col items-center">
<div class="flex items-center gap-2 mb-4">
<div class="w-12 h-12 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/10">
<span class="material-symbols-outlined text-surface text-2xl" data-icon="shield" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<span class="text-2xl font-extrabold tracking-tighter text-primary">SecureHub</span>
</div>
<div class="text-center space-y-1">
<h1 class="text-3xl font-bold tracking-tight text-on-surface">Secure Access</h1>
<p class="text-on-surface-variant text-sm font-medium">Verify your identity to proceed</p>
</div>
</header>
<main class="w-full max-w-md px-8 z-10 flex-grow flex flex-col justify-center">
<form class="space-y-5" onsubmit="return false;">
<div class="space-y-4">
<div class="relative">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-6 mb-2">Identifier</label>
<div class="flex items-center bg-surface-container-low rounded-full px-6 py-4 focus-within:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-3 text-[20px]" data-icon="mail">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50 font-medium" placeholder="Email or Username" type="text"/>
</div>
</div>
<div class="relative">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-6 mb-2">Keycode</label>
<div class="flex items-center bg-surface-container-low rounded-full px-6 py-4 focus-within:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mr-3 text-[20px]" data-icon="lock">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface placeholder:text-on-surface-variant/50 font-medium" placeholder="••••••••" type="password"/>
<button class="text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<div class="flex justify-end px-2">
<a class="text-xs font-semibold text-primary hover:opacity-70 transition-opacity" href="#">Forgot Password?</a>
</div>
<div class="pt-4 space-y-6">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-5 rounded-full font-bold text-lg shadow-xl shadow-primary/20 active:scale-[0.98] transition-transform">
                    Log In
                </button>
<div class="flex flex-col items-center gap-4">
<p class="text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Or authenticate via</p>
<div class="flex gap-6">
<button class="w-16 h-16 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm hover:shadow-md transition-shadow active:scale-90 border border-outline-variant/10">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="faceid">face</span>
</button>
<button class="w-16 h-16 bg-surface-container-lowest rounded-full flex items-center justify-center shadow-sm hover:shadow-md transition-shadow active:scale-90 border border-outline-variant/10">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="fingerprint">fingerprint</span>
</button>
</div>
</div>
</div>
</form>
</main>
<footer class="w-full px-8 pb-10 z-10">
<div class="flex flex-col items-center gap-8">
<button class="flex items-center gap-2 px-6 py-3 bg-error/5 hover:bg-error/10 text-error rounded-full transition-colors active:scale-95 group">
<span class="material-symbols-outlined text-lg group-hover:scale-110 transition-transform" data-icon="emergency_home" style="font-variation-settings: 'FILL' 1;">emergency_home</span>
<span class="text-xs font-bold tracking-widest uppercase">Emergency Response</span>
</button>
<p class="text-[11px] text-on-surface-variant/60 font-medium">
                Protected by Sentinel Slate v2.0
            </p>
</div>
</footer>
<div class="absolute bottom-[-10%] right-[-10%] w-[50%] aspect-square bg-primary/5 rounded-full blur-[100px]"></div>
<div class="absolute top-[-5%] left-[-5%] w-[40%] aspect-square bg-secondary/5 rounded-full blur-[80px]"></div>
</body></html>
