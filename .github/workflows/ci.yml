name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-with-enough-entropy-for-deploy-checks
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_USE_SQLITE: "True"
      DJANGO_QUIET_TEST_LOGS: "True"
      CELERY_TASK_ALWAYS_EAGER: "True"
      DJANGO_CACHE_URL: redis://localhost:6379/1
      ENABLE_API_DOCS: "False"
      HIK_PARTNER_DRY_RUN: "True"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Dependency audit
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Django checks
        run: python manage.py check --deploy

      - name: Run tests
        run: python manage.py test --verbosity=1

  dashboard-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build:dashboard-css
      - name: Verify CSS is committed
        run: git diff --exit-code backend/apps/dashboard/static/dashboard/css/console.css

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: securehub_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test
