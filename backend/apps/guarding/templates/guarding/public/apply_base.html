{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Security Guard Application{% endblock %} | SecureHub</title>
    <script>
        (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}})();
    </script>
    <link rel="stylesheet" href="{% static 'dashboard/css/console.css' %}">
    <link rel="icon" href="{% static 'dashboard/logo.png' %}">
    {% block apply_form_script %}{% endblock %}
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"
            integrity="sha384-iZD2X8o1Zdq0HR5H/7oa8W30WS4No+zWCKUPD7fHRay9I1Gf+C4F8sVmw7zec1wW"
            crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-size: 14px; -webkit-font-smoothing: antialiased; }
        [x-cloak] { display: none !important; }
        .guarding-apply-shell { max-width: 42rem; }
        @media (min-width: 640px) { .guarding-apply-shell { max-width: 48rem; } }
        .guarding-apply-hero { margin-bottom: 1.5rem; text-align: center; }
        .guarding-apply-steps {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .guarding-apply-steps__item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.35rem;
            text-align: center;
        }
        .guarding-apply-steps__num {
            display: flex;
            height: 1.75rem;
            width: 1.75rem;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            border: 2px solid #e2e8f0;
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            transition: border-color 0.15s, background 0.15s, color 0.15s;
        }
        .dark .guarding-apply-steps__num { border-color: #334155; color: #94a3b8; }
        .guarding-apply-steps__item.is-active .guarding-apply-steps__num,
        .guarding-apply-steps__item.is-done .guarding-apply-steps__num {
            border-color: var(--brand, #dc2626);
            background: var(--brand, #dc2626);
            color: #fff;
        }
        .guarding-apply-steps__item.is-done .guarding-apply-steps__num { opacity: 0.85; }
        .guarding-apply-steps__label {
            font-size: 10px;
            font-weight: 600;
            line-height: 1.2;
            color: #94a3b8;
        }
        .guarding-apply-steps__item.is-active .guarding-apply-steps__label { color: var(--brand, #dc2626); }
        .guarding-apply-steps__item.is-done .guarding-apply-steps__label { color: #64748b; }
        .guarding-apply-repeat {
            border-radius: 0.5rem;
            border: 1px solid #e2e8f0;
            background: #fff;
            padding: 1rem;
        }
        .dark .guarding-apply-repeat { border-color: #334155; background: rgba(15, 23, 42, 0.5); }
        .guarding-apply-doc-card {
            border-radius: 0.5rem;
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            padding: 1rem;
        }
        .dark .guarding-apply-doc-card { border-color: #475569; background: rgba(30, 41, 59, 0.4); }
        .guarding-apply-doc-card--required { border-style: solid; border-color: #e2e8f0; }
        .dark .guarding-apply-doc-card--required { border-color: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans min-h-screen py-6 px-4 sm:py-10">
    <div class="guarding-apply-shell mx-auto w-full">
        <header class="guarding-apply-hero">
            <img src="{% static 'dashboard/login-logo.png' %}" alt="SecureHub" class="mx-auto mb-3 h-12 w-auto object-contain sm:h-14">
            <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 dark:text-slate-400">Response One Ghana Ltd.</p>
            {% block hero_extra %}{% endblock %}
        </header>
        {% block body %}{% endblock %}
        <p class="mt-6 text-center text-[11px] text-slate-400 dark:text-slate-500">
            Your information is used only for recruitment purposes.
        </p>
    </div>
</body>
</html>
