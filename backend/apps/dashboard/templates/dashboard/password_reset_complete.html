{% extends "dashboard/password_reset_base.html" %}

{% block title %}Password Updated{% endblock %}

{% block content %}
<p class="mb-6 text-xs font-semibold leading-5 text-slate-500 dark:text-slate-400">
    Your password has been updated. You can sign in with the new password now.
</p>
<a href="{% url 'dashboard:login' %}"
   class="block w-full py-3 rounded bg-slate-900 dark:bg-slate-800 text-center text-white text-[10px] font-black uppercase tracking-[0.15em] hover:bg-slate-800 dark:hover:bg-slate-700 transition-all shadow-lg shadow-slate-900/10 active:scale-95">
    Sign In
</a>
{% endblock %}
