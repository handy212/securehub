<style>
    .guarding-shell {
        display: grid;
        gap: 1rem;
        grid-template-columns: minmax(0, 1fr);
    }
    .guarding-subnav {
        width: 100%;
        transition: width .18s ease;
    }
    .guarding-main {
        min-width: 0;
    }
    .guarding-modal-panel {
        max-height: min(88vh, 52rem);
        overflow-y: auto;
        border-radius: .5rem;
    }
    @media (min-width: 1024px) {
        .guarding-shell {
            align-items: start;
            grid-template-columns: 13rem minmax(0, 1fr);
            transition: grid-template-columns .18s ease;
        }
        .guarding-shell.guarding-shell-collapsed {
            grid-template-columns: 4.5rem minmax(0, 1fr);
        }
        .guarding-subnav {
            position: sticky;
            top: 0;
            width: 13rem;
        }
        .guarding-shell.guarding-shell-collapsed .guarding-subnav {
            width: 4.5rem;
        }
        .guarding-shell.guarding-shell-collapsed .guarding-nav-link {
            justify-content: center;
            padding-left: .5rem;
            padding-right: .5rem;
        }
    }
</style>
<div class="guarding-shell" x-data="{ guardNavCollapsed: localStorage.getItem('guardingNavCollapsed') === '1', toggleGuardNav() { this.guardNavCollapsed = !this.guardNavCollapsed; localStorage.setItem('guardingNavCollapsed', this.guardNavCollapsed ? '1' : '0'); } }" :class="guardNavCollapsed ? 'guarding-shell-collapsed' : ''">
