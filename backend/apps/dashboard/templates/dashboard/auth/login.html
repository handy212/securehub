{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureHub Console</title>
    <script>
        (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}})();
    </script>
    <link rel="stylesheet" href="{% static 'dashboard/css/console.css' %}">
    <link rel="icon" href="{% static 'dashboard/logo.png' %}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-size: 14px; -webkit-font-smoothing: antialiased; }
        .input-focus:focus { border-color: #0f172a; box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.05); }
        .dark .input-focus:focus { border-color: #ef4444; box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.12); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-sm">
        <!-- Brand -->
        <div class="flex flex-col items-center mb-8">
            <img src="{% static 'dashboard/logo.png' %}" alt="SecureHub" class="h-16 w-auto object-contain mb-3">
            <p class="console-meta">Response One Ghana Ltd.</p>
        </div>

        <!-- Identity Card -->
        <div class="console-table-card overflow-hidden">
            <div class="console-card-section-title p-8">
                <h2 class="console-panel-title">Sign In</h2>
            </div>

            <div class="p-8">
                {% if error %}
                <div class="mb-6 px-3 py-2 rounded bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-900/50 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-red-500"></div>
                    <span class="text-[11px] text-red-600 dark:text-red-400 font-semibold tracking-tight">{{ error }}</span>
                </div>
                {% endif %}

                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="space-y-1.5">
                        <label class="console-label text-slate-500 dark:text-slate-400">Username / Email</label>
                        <input type="text" name="username" autofocus autocomplete="username" required
                               class="console-auth-input placeholder:text-slate-300 dark:placeholder:text-slate-600">
                    </div>

                    <div class="space-y-1.5">
                        <label class="console-label text-slate-500 dark:text-slate-400">Password</label>
                        <input type="password" name="password" autocomplete="current-password" required
                               class="console-auth-input">
                    </div>

	                    <button type="submit" class="btn-console w-full justify-center mt-4 py-3 shadow-lg shadow-slate-900/10">
	                        Authorize Access
	                    </button>
	                    <div class="pt-1 text-center">
	                        <a href="{% url 'dashboard:password-reset' %}" class="text-[10px] font-semibold tracking-[0.14em] text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 transition-colors">Forgot password?</a>
	                    </div>
	                </form>
            </div>
        </div>
    </div>

</body>
</html>
