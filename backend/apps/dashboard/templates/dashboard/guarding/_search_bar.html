{% comment %}
Optional `with`:
  search_placeholder — default "Search…"
  current_query — bound value
{% endcomment %}
<form method="get" class="console-search-bar console-table-card !rounded-lg !border !border-slate-100 !px-2.5 !py-2 dark:!border-slate-800">
    <svg class="shrink-0 text-slate-300" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input name="q" value="{{ current_query|default:'' }}" placeholder="{{ search_placeholder|default:'Search…' }}" class="console-search-input">
    <button type="submit" class="btn-console-secondary shrink-0 py-1.5 text-[11px]">Search</button>
</form>
