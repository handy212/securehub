{# Optional: credential for edit mode #}
<div class="grid gap-3 sm:grid-cols-2">
    <div class="form-group">
        <label>Guard *</label>
        <select name="guard_id" required {% if not credential %}data-modal-initial-focus{% endif %}>
            {% for guard in guards %}<option value="{{ guard.id }}" {% if credential and credential.guard_id == guard.id %}selected{% endif %}>{{ guard.full_name }} · {{ guard.employee_number }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Credential type</label>
        <select name="credential_type">{% for value,label in credential_types %}<option value="{{ value }}" {% if credential and credential.credential_type == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
    </div>
</div>
<div class="grid gap-3 sm:grid-cols-2">
    <div class="form-group">
        <label>Name *</label>
        <input name="name" required value="{% if credential %}{{ credential.name }}{% endif %}">
    </div>
    <div class="form-group">
        <label>Issuing authority</label>
        <input name="issuing_authority" value="{% if credential %}{{ credential.issuing_authority }}{% endif %}">
    </div>
</div>
<div class="grid gap-3 sm:grid-cols-3">
    <div class="form-group">
        <label>Reference #</label>
        <input name="reference_number" value="{% if credential %}{{ credential.reference_number }}{% endif %}">
    </div>
    <div class="form-group">
        <label>Issued on</label>
        <input name="issued_on" type="date" value="{% if credential and credential.issued_on %}{{ credential.issued_on|date:'Y-m-d' }}{% endif %}">
    </div>
    <div class="form-group">
        <label>Expires on</label>
        <input name="expires_on" type="date" value="{% if credential and credential.expires_on %}{{ credential.expires_on|date:'Y-m-d' }}{% endif %}">
    </div>
</div>
<label class="guarding-check"><input name="verified" type="checkbox" {% if credential and credential.verified %}checked{% endif %}> Mark as verified</label>
<div class="form-group">
    <label>Notes</label>
    <textarea name="notes" class="w-full">{% if credential %}{{ credential.notes }}{% endif %}</textarea>
</div>
