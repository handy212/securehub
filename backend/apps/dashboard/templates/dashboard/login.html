{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureHub Console</title>
    <script>
        (function(){var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.classList.add('dark');}})();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: '#0f172a' }
                }
            }
        }
    </script>
    <style>
        body { font-size: 14px; -webkit-font-smoothing: antialiased; }
        .input-focus:focus { border-color: #0f172a; box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.05); }
        .dark .input-focus:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans min-h-screen flex items-center justify-center p-6">

    <div class="w-full max-w-sm">
        <!-- Brand -->
        <div class="flex flex-col items-center mb-8">
            <img src="{% static 'dashboard/login-logo.png' %}" alt="SecureHub" class="h-16 w-auto object-contain mb-3">
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Response One Ghana Ltd.</p>
        </div>

        <!-- Identity Card -->
        <div class="bg-white dark:bg-slate-900 rounded border border-slate-200 dark:border-slate-800 shadow-sm overflow-hidden">
            <div class="p-8 border-b border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/30">
                <h2 class="text-sm font-black text-slate-900 dark:text-slate-100 uppercase tracking-widest">Sign In</h2>
            </div>

            <div class="p-8">
                {% if error %}
                <div class="mb-6 px-3 py-2 rounded bg-red-50 dark:bg-red-950/40 border border-red-100 dark:border-red-900/50 flex items-center gap-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-red-500"></div>
                    <span class="text-[11px] text-red-600 dark:text-red-400 font-black uppercase tracking-tight">{{ error }}</span>
                </div>
                {% endif %}

                <form method="post" class="space-y-4">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next }}">

                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400">Username / Email</label>
                        <input type="text" name="username" autofocus autocomplete="username" required
                               class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[13px] font-bold text-slate-900 dark:text-slate-100 placeholder:text-slate-300 dark:placeholder:text-slate-600 outline-none transition-all input-focus">
                    </div>

                    <div class="space-y-1.5">
                        <label class="text-[9px] font-black uppercase tracking-widest text-slate-500 dark:text-slate-400">Password</label>
                        <input type="password" name="password" autocomplete="current-password" required
                               class="w-full px-3 py-2 rounded border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-[13px] font-bold text-slate-900 dark:text-slate-100 outline-none transition-all input-focus">
                    </div>

                    <button type="submit"
                            class="w-full mt-4 py-3 rounded bg-brand dark:bg-brand text-white text-[10px] font-black uppercase tracking-[0.15em] hover:bg-slate-800 dark:hover:bg-slate-700 transition-all shadow-lg shadow-slate-900/10 active:scale-95">
                        Authorize Access
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
